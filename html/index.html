<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <link rel="stylesheet" href="../css/styles.css">
  <script type="module" src="../js/app.js"></script>
</head>
<body>
<header class="app-header text-center py-4">
  <h1>
    <img src="../Imagenes/International_Pokémon_logo.svg.webp" alt="Pokédex" class="logo-header">
  </h1>
  <p class="subtitulo">Buscá tu Pokémon por nombre o número</p>
</header>>

  <main class="container">

    <!-- 2. Buscador -->
    <section class="seccion-buscador mb-4">
      <div class="row">
        <div class="col-md-8 offset-md-2 d-flex">
          <input id="pokemonInput" type="text" class="form-control me-2" placeholder="Nombre o Id">
          <button id="BuscarBtn" class="btn btn-primary me-2">Buscar</button>
          <button id="VolverBtn" class="btn btn-outline-secondary">Volver</button>
        </div>
      </div>
    </section>

    <!-- 3. Resultados -->
    <section class="seccion-resultados">
      <div id="spinner" class="text-center d-none">
        <div class="spinner-border text-danger" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </div>
      <div id="pokemonContainer" class="row g-3"></div>
    </section>

  </main>

</body>
</html>
