<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <link rel="stylesheet" href="../css/styles.css">
  <script type="module" src="../js/app.js"></script>
</head>
<body>
  <div class="container my-5">
    <h1 class="text-center mb-4">Pokédex</h1>

    <div class="row mb-4">
      <div class="col-md-8 offset-md-2 d-flex">
        <input id="pokemonInput" type="text" class="form-control me-2" placeholder="Buscar Pokémon por nombre o número}">
        <button id="BuscarBtn" class="btn btn-primary me-2">Buscar</button>
        <button id="VolverBtn" class="btn btn-outline-secondary">Volver</button>
      </div>
    </div>

    <div id="spinner" class="text-center d-none">
      <div class="spinner-border text-danger" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>

    <div id="pokemonContainer" class="row g-3"></div>
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
